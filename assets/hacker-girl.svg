<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#C2330A"/>
    </linearGradient>
  </defs>

  <!-- brilho de fundo -->
  <circle cx="115" cy="135" r="115" fill="url(#glow)"/>

  <!-- estrelas -->
  <g fill="#FFD2A8">
    <circle cx="22" cy="28" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="238" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="14" cy="120" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="110" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- cabelo (parte de trás e espetos) -->
  <ellipse cx="115" cy="118" rx="52" ry="56" fill="#B81800"/>
  <path d="M72 100 L50 118 L76 124 Z" fill="#FF2D00"/>
  <path d="M158 100 L180 116 L154 124 Z" fill="#FF2D00"/>
  <path d="M86 66 L76 30 L106 54 Z" fill="#FF2D00"/>
  <path d="M110 54 L118 18 L132 54 Z" fill="#FF5A1F"/>
  <path d="M132 56 L158 30 L150 66 Z" fill="#FF2D00"/>
  <path d="M60 140 L44 158 L74 156 Z" fill="#B81800"/>
  <path d="M170 140 L186 158 L156 156 Z" fill="#B81800"/>

  <!-- corpo / moletom -->
  <path d="M38 260 Q42 192 115 186 Q188 192 192 260 Z" fill="url(#hoodie)"/>
  <path d="M92 190 Q115 212 138 190" stroke="#8A1F00" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="104" y1="205" x2="102" y2="230" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
  <line x1="126" y1="205" x2="128" y2="230" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>

  <!-- pescoço -->
  <rect x="103" y="164" width="24" height="28" rx="6" fill="#E9B98F"/>

  <!-- rosto -->
  <ellipse cx="115" cy="128" rx="38" ry="42" fill="#F7D3B0"/>

  <!-- franja -->
  <path d="M75 108 Q80 80 115 76 Q150 80 155 108 Q144 94 130 102 Q120 88 110 102 Q94 92 75 108 Z" fill="#FF2D00"/>
  <path d="M96 84 Q112 78 128 82" stroke="#FF8A00" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- óculos na testa -->
  <rect x="72" y="82" width="86" height="8" rx="4" fill="#1B1B1F"/>
  <circle cx="95" cy="86" r="12" fill="#FF8A00" stroke="#0D1117" stroke-width="3.5"/>
  <circle cx="135" cy="86" r="12" fill="#FF8A00" stroke="#0D1117" stroke-width="3.5"/>
  <circle cx="95" cy="86" r="7" fill="#FFC15E" opacity="0.7"/>
  <circle cx="135" cy="86" r="7" fill="#FFC15E" opacity="0.7"/>
  <circle cx="91" cy="82" r="2.4" fill="#fff" opacity="0.9"/>
  <circle cx="131" cy="82" r="2.4" fill="#fff" opacity="0.9"/>

  <!-- olhos (piscando) -->
  <ellipse cx="100" cy="128" rx="4.2" ry="5.2" fill="#0D1117">
    <animate attributeName="ry" values="5.2;5.2;0.6;5.2;5.2" keyTimes="0;0.86;0.9;0.94;1" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="130" cy="128" rx="4.2" ry="5.2" fill="#0D1117">
    <animate attributeName="ry" values="5.2;5.2;0.6;5.2;5.2" keyTimes="0;0.86;0.9;0.94;1" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="101.5" cy="126" r="1.3" fill="#fff"/>
  <circle cx="131.5" cy="126" r="1.3" fill="#fff"/>

  <!-- bochechas e sorriso -->
  <circle cx="90" cy="142" r="6" fill="#FF8A00" opacity="0.25"/>
  <circle cx="140" cy="142" r="6" fill="#FF8A00" opacity="0.25"/>
  <path d="M98 146 Q115 164 132 146 Z" fill="#8A1F00"/>
  <path d="M104 148 L126 148 Q115 156 104 148 Z" fill="#fff"/>

  <!-- painel holográfico de código -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3.4s" repeatCount="indefinite"/>
    <g transform="rotate(-7 200 175)">
      <rect x="160" y="140" width="92" height="78" rx="7" fill="#0D1117" fill-opacity="0.92" stroke="#FF5A1F" stroke-width="2"/>
      <circle cx="171" cy="150" r="2.4" fill="#FF2D00"/>
      <circle cx="180" cy="150" r="2.4" fill="#FF8A00"/>
      <circle cx="189" cy="150" r="2.4" fill="#FFC15E"/>
      <rect x="168" y="162" width="34" height="4" rx="2" fill="#FF5A1F"/>
      <rect x="168" y="172" width="58" height="4" rx="2" fill="#F5F5F5" opacity="0.8"/>
      <rect x="176" y="182" width="44" height="4" rx="2" fill="#FF8A00"/>
      <rect x="176" y="192" width="28" height="4" rx="2" fill="#F5F5F5" opacity="0.8"/>
      <rect x="168" y="202" width="14" height="6" rx="1" fill="#FF8A00">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.51;0.99;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- escudo flutuante -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 7; 0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M30 150 L52 158 L52 180 Q52 196 30 206 Q8 196 8 180 L8 158 Z" fill="#0D1117" stroke="#FF8A00" stroke-width="2.4"/>
    <circle cx="30" cy="176" r="5" fill="#FF5A1F"/>
    <rect x="28" y="178" width="4" height="10" rx="2" fill="#FF5A1F"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
