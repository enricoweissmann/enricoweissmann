<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="planet" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="0.55" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#8A1200"/>
    </radialGradient>
  </defs>

  <!-- estrelas -->
  <g fill="#FFD2A8">
    <circle cx="20" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="175" cy="25" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="185" cy="150" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="25" cy="170" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="185" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- órbita -->
  <ellipse id="path" cx="100" cy="100" rx="82" ry="30" fill="none" stroke="#FF8A00" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 5" transform="rotate(-25 100 100)"/>

  <!-- planeta -->
  <circle cx="100" cy="100" r="34" fill="url(#planet)"/>
  <path d="M70 96 Q100 86 130 98" stroke="#FFD2A8" stroke-opacity="0.35" stroke-width="2" fill="none"/>
  <path d="M68 110 Q100 102 132 112" stroke="#FFD2A8" stroke-opacity="0.25" stroke-width="2" fill="none"/>

  <!-- satélite -->
  <g transform="rotate(-25 100 100)">
    <g>
      <animateMotion dur="7s" repeatCount="indefinite" path="M182 100 A82 30 0 1 1 18 100 A82 30 0 1 1 182 100"/>
      <rect x="-4" y="-3" width="8" height="6" fill="#F5F5F5"/>
      <rect x="-12" y="-1.5" width="7" height="3" fill="#FF2D00"/>
      <rect x="5" y="-1.5" width="7" height="3" fill="#FF2D00"/>
      <circle r="1" cy="-5" fill="#FF8A00"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
